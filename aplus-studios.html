<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A+ Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #000;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .page {
    width: 100%;
    max-width: 400px;
  }

  .title {
    font-size: 42px;
    font-weight: 300;
    letter-spacing: -2px;
    margin-bottom: 28px;
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    display: block;
    padding: 14px 20px;
    border: 1.5px solid #000;
    border-radius: 12px;
    background: #fff;
    color: #000;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    text-align: left;
  }

  .btn:hover {
    background: #000;
    color: #fff;
  }

  .btn-discord {
    border-color: #5865F2;
    color: #5865F2;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-discord:hover {
    background: #5865F2;
    color: #fff;
    border-color: #5865F2;
  }

  .btn-release {
    cursor: default;
    border-style: dashed;
  }

  .btn-release:hover {
    background: #fff;
    color: #000;
  }

  .countdown-label {
    font-size: 11px;
    color: #999;
    margin-bottom: 3px;
    font-weight: 400;
  }

  #countdown-display {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .btn-watch {
    background: #000;
    color: #fff;
    border-radius: 12px;
    border-color: #000;
  }

  .btn-watch:hover {
    background: #222;
  }
</style>
</head>
<body>
<div class="page">

  <div class="title">A+ Studios</div>

  <div class="btn-group">

    <a href="https://www.youtube.com/@A-plus-studios" target="_blank" class="btn">
      Youtube Kanal
    </a>

    <a href="https://www.youtube.com/watch?v=lDWmRVf1qGU" target="_blank" class="btn">
      Jonathan: The Tricycle Heist
    </a>

    <a href="https://www.youtube.com/watch?v=lDWmRVf1qGU" target="_blank" class="btn">
      Jonathan 2 — Trailer
    </a>

    <div id="release-wrapper">
      <div class="btn btn-release">
        <div class="countdown-label">Jonathan 2 — Premiär om</div>
        <div id="countdown-display">-- : -- : -- : --</div>
      </div>
    </div>

    <a href="https://discord.gg/6uM656AwvE" target="_blank" class="btn btn-discord">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="currentColor">
        <path d="M15.25 1.18A14.87 14.87 0 0 0 11.5 0c-.17.3-.37.7-.5 1.02a13.72 13.72 0 0 0-4 0A10.9 10.9 0 0 0 6.5 0a14.93 14.93 0 0 0-3.76 1.18A15.5 15.5 0 0 0 0 11.37a14.94 14.94 0 0 0 4.58 2.32c.37-.5.7-1.04.98-1.6a9.7 9.7 0 0 1-1.54-.74l.37-.29a10.65 10.65 0 0 0 9.22 0l.37.29c-.49.29-1 .54-1.54.74.28.57.61 1.1.98 1.6A14.89 14.89 0 0 0 18 11.37 15.47 15.47 0 0 0 15.25 1.18ZM6.01 9.3c-.86 0-1.57-.8-1.57-1.78s.69-1.78 1.57-1.78c.87 0 1.58.8 1.57 1.78 0 .98-.7 1.78-1.57 1.78Zm5.98 0c-.87 0-1.57-.8-1.57-1.78s.69-1.78 1.57-1.78c.87 0 1.58.8 1.57 1.78 0 .98-.7 1.78-1.57 1.78Z"/>
      </svg>
      Discord
    </a>

  </div>
</div>

<script>
const TARGET = new Date('2026-05-31T20:00:00');
function pad(n) { return String(n).padStart(2, '0'); }
function tick() {
  const diff = TARGET - new Date();
  if (diff <= 0) {
    document.getElementById('release-wrapper').innerHTML =
      `<a href="https://youtube.com/REPLACE_ME" target="_blank" class="btn btn-watch">▶ Watch Jonathan 2 Now</a>`;
    clearInterval(id);
    return;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  document.getElementById('countdown-display').textContent =
    `${pad(d)}d  ${pad(h)}h  ${pad(m)}m  ${pad(s)}s`;
}
const id = setInterval(tick, 1000);
tick();
</script>
</body>
</html>
